version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directories:
      - /
      - /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
    groups:
      go:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
