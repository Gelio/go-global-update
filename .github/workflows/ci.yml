name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        go-version: ["go.mod", "oldstable", "stable"]
        os: [ubuntu-latest, macos-latest, windows-latest]
      # Continue other jobs if one matrix job fails
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Run the toolchain setup-go installed; never auto-download a newer one
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version:
            ${{ matrix.go-version != 'go.mod' && matrix.go-version || '' }}
          go-version-file:
            ${{ matrix.go-version == 'go.mod' && 'go.mod' || '' }}

      - run: go version
      - run: go build
      - run: go test -race ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          go-package: ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Read golangci-lint version from tools/go.mod
        id: golangci-version
        run: |
          echo "version=$(go list -modfile=tools/go.mod -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-version.outputs.version }}

  verify-table-of-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm install

      - run: npm run generate-toc
      - name: Verify table of contents
        run: git diff --exit-code

      - name: Check formatting of Markdown documents
        run: npm run format-docs:check
